# Plan radio de la mission VEAF Open Training GermanyCW (moderne).
# L'ATC DCS est coupé (silence_atc_on_all_airbases), mais les canaux de base portent les fréquences que
# DCS donne à l'aérodrome (vue F10). La collection 'bases' s'écrit avec l'outil, jamais à la main :
#   veaf-tools content airfield-channels --apply "<aérodrome>" ... <dossier de mission>
# puis tools/sync_briefing_bases.py, tools/gather.py et tools/gen_readme.py.
# Même fréquence partout : groupe DCS, preset, texte ASSETS, briefing.
