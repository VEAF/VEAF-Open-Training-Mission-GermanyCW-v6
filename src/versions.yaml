      temperature: 16.0
      wind_speed: 3.0
      wind_direction: 240.0
      visibility: 40000
      cloud_type: "clear"
      fog_enabled: false

  - name: matin-epars
    time: "09:00"
    metar: "METAR ETAR 140700Z 25008KT 9999 SCT035 SCT080 16/08 Q1017"

  - name: matin-pluie
    time: "09:00"
    metar: "METAR ETAR 140700Z 23014G24KT 6000 RA BKN012 OVC030 12/11 Q1006"

  - name: jour-reel
    time: "14:00"
    airport_icao: ETAR

  - name: jour-degage
    time: "14:00"
    weather:
      temperature: 23.0
      wind_speed: 3.0
      wind_direction: 240.0
      visibility: 40000
      cloud_type: "clear"
      fog_enabled: false

  - name: jour-epars
    time: "14:00"
    metar: "METAR ETAR 141200Z 25008KT 9999 SCT035 SCT080 23/08 Q1017"

  - name: jour-pluie
    time: "14:00"
    metar: "METAR ETAR 141200Z 23014G24KT 6000 RA BKN012 OVC030 19/18 Q1006"

  - name: soir-reel
    time: "sunset-45*60"
