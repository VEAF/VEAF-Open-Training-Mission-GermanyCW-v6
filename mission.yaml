        training: false
        briefing: "Kyritz-Ruppiner Heide (BULLSEYE 052/105) : une batterie SA-10 isolée sur l'ancien champ de tir de la Kyritz-Ruppiner Heide, au sud de Wittstock. À détruire : la batterie SA-10 (radars et lanceurs). Défense : SA-10 et un SA-15 Tor en défense rapprochée, en réseau Skynet. Hors couverture QRA rouge. Ravitailleurs les plus proches : Texaco 1 (perche, TACAN 51Y, 251.0) à 117 nm, Arco 1 (panier, TACAN 52Y, 252.0) à 128 nm."
      - type: zone
