      - type: zone
        zone_name: combatZone_Werneuchen
        friendly_name: Base aérienne de Werneuchen
        radio_group_name: Bases aériennes
        training: false
        briefing: "Base aérienne de Werneuchen (BULLSEYE 074/127) : la base aérienne de Werneuchen, à l'est de Berlin, avec des Su-30, des MiG-31 et un Il-76. À détruire : les avions au parking (quatre des cinq présents, tirés au sort à chaque activation). Défense : SA-22 Pantsir et SA-11 Buk ; la base est sous le parapluie du SA-10 de Berlin. Sous la couverture de la QRA Berlin. Ravitailleurs les plus proches : Texaco 1 (perche, TACAN 51Y, 251.0) à 158 nm, Arco 1 (panier, TACAN 52Y, 252.0) à 169 nm."
