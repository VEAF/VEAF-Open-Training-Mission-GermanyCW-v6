      - type: zone
        zone_name: combatZone_Baumholder_Easy
        friendly_name: Baumholder - facile
        briefing: 'Entraînement cibles pour hélicoptères à Baumholder (BULLSEYE 233/180), niveau facile. Véhicules inertes (blindés et camions), qui ne tirent pas : trois des cinq, tirés au sort à chaque activation, aucune défense. Ravitailleur le plus proche : Shell 1 (TACAN 55Y, 255.0) à 16 nm. Un seul niveau de cette famille à la fois.'
