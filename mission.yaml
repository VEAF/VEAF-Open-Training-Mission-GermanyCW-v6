        training: true
        includes: [combatZone_Baumholder_Easy]
      - type: zone
        zone_name: combatZone_Baumholder_Hard
        friendly_name: Baumholder - difficile
        briefing: 'Entraînement cibles pour hélicoptères à Baumholder (BULLSEYE 233/180), niveau difficile. Ajoute une défense courte portée (batterie VEAF de niveau 3 : missiles IR et AAA) et des MANPADS, en plus du niveau moyen. Ravitailleur le plus proche : Shell 1 (TACAN 55Y, 255.0) à 16 nm. Un seul niveau de cette famille à la fois.'
