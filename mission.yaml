        training: false
        briefing: "Rade de Rostock (BULLSEYE 028/156) : des cargos et un pétrolier au mouillage devant Warnemünde, à l'entrée du port de Rostock, escortés par une corvette. À détruire : les cargos, le pétrolier et la corvette. Défense : la corvette Molniya ; la rade est sous le parapluie du SA-10 de Rostock. Sous la couverture de la QRA Laage. Ravitailleurs les plus proches : Texaco 1 (perche, TACAN 51Y, 251.0) à 115 nm, Arco 1 (panier, TACAN 52Y, 252.0) à 124 nm."
