# mission.yaml — VEAF Open Training GermanyCW (moderne)
# Généré par `veaf-tools prepare --template standard`, puis réécrit pour cette mission.
# `veaf-tools validate` pour contrôler, `veaf-tools build` pour construire.
#
# Deux usages, deux configurations :
#   - par défaut        = serveur VEAF : sécurité active, logs info, toutes les variantes météo ;
#   - profil LOCAL_TEST = essais sur un poste : `veaf-tools mission build --profile LOCAL_TEST`
#     (sécurité coupée, logs debug, noms de groupes lisibles, pas de variantes météo).

global_log_level: info

# ── Mission ──────────────────────────────────────────────────────────────────
mission:
  # _ICAO_ETAR : RealWeather (DCSServerBot) lit le METAR de Ramstein, la base mère.
  name: VEAF_OpenTraining_GermanyCW_ICAO_ETAR
  era: MODERN
  language: fr
  silence_atc_on_all_airbases: true
  hide_names_from_spawned_groups: true

# ── Sécurité ─────────────────────────────────────────────────────────────────
# Active sur le serveur, sans mot de passe : les commandes protégées restent
# réservées au niveau des pilotes du serveur VEAF.
security:
  disabled: false

