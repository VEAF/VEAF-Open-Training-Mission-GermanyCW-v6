        training: true
        includes: [combatZone_Baumholder_Medium]
      - type: zone
        zone_name: combatZone_WahnerHeide_Easy
        friendly_name: Wahner Heide - facile
        briefing: "Entraînement cibles pour avions d'attaque à Wahner Heide (BULLSEYE 257/144), niveau facile. Véhicules inertes (chars, VCI, camions), qui ne tirent pas : cinq des sept, tirés au sort à chaque activation. Ravitailleur le plus proche : Arco 2 (TACAN 54Y, 254.0) à 57 nm. Un seul niveau de cette famille à la fois."
        radio_group_name: Entraînement attaque
        training: true
      - type: zone
        zone_name: combatZone_WahnerHeide_Medium
        friendly_name: Wahner Heide - moyen
        briefing: "Entraînement cibles pour avions d'attaque à Wahner Heide (BULLSEYE 257/144), niveau moyen. Ajoute un peloton blindé actif et de l'AAA légère, en plus du niveau facile. Ravitailleur le plus proche : Arco 2 (TACAN 54Y, 254.0) à 57 nm. Un seul niveau de cette famille à la fois."
