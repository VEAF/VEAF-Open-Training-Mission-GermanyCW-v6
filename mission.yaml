      - type: zone
        zone_name: combatZone_Hunsrueck_SAR
        friendly_name: Hunsrück - recherche et sauvetage
        briefing: "Navigation et recherche d'équipage dans le Hunsrück (BULLSEYE 237/172), sans ennemi. Un UH-60A s'est posé en catastrophe au nord-ouest de Kastellaun (BULLSEYE 241/160), vers la Moselle. Départ conseillé : FARP de Baumholder. Suivez les balises radio (FM, relevables au radiogoniomètre) : MH01 sur 31.0 (Erbeskopf), MH02 sur 32.0 (Kirchberg), MH03 sur 33.0 (Kastellaun). L'équipage émet un SOS sur 34.0 FM depuis le lieu de l'accident. Les balises n'émettent que lorsque la zone est activée."
