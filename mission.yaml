        training: true
      - type: zone
        zone_name: combatZone_Baumholder_Medium
        friendly_name: Baumholder - moyen
        briefing: "Entraînement cibles pour hélicoptères à Baumholder (BULLSEYE 233/180), niveau moyen. Ajoute de l'AAA légère (ZU-23 ou Shilka, tirée au sort à chaque activation), en plus du niveau facile. Ravitailleur le plus proche : Shell 1 (TACAN 55Y, 255.0) à 16 nm. Un seul niveau de cette famille à la fois."
