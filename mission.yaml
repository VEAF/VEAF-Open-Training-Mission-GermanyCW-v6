        briefing: "Convoi A2 (BULLSEYE 070/81) : un convoi logistique qui roule vers l'ouest sur l'axe Brandenburg - Genthin - Burg (A2 / B1), vers Magdeburg. À détruire : le convoi (camions, citernes, escorte). Défense : sa propre défense : un Shilka et un SA-13 roulent avec lui. Sous la couverture de la QRA Berlin. Ravitailleurs les plus proches : Texaco 1 (perche, TACAN 51Y, 251.0) à 116 nm, Arco 1 (panier, TACAN 52Y, 252.0) à 127 nm."
