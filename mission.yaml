        radio_group_name: Entraînement attaque
        training: true
        includes: [combatZone_WahnerHeide_Medium]
      - type: zone
        zone_name: combatZone_Borkenberge_Easy
        friendly_name: Borkenberge - facile
        briefing: 'Entraînement site SEAD/DEAD à Borkenberge (BULLSEYE 279/125), niveau facile. Une batterie moyenne portée seule : SA-6 ou SA-11, tirée au sort à chaque activation. Ravitailleur le plus proche : Arco 2 (TACAN 54Y, 254.0) à 79 nm. Un seul niveau de cette famille à la fois.'
        radio_group_name: Entraînement SEAD
        training: true
      - type: zone
        zone_name: combatZone_Borkenberge_Medium
        friendly_name: Borkenberge - moyen
        briefing: 'Entraînement site SEAD/DEAD à Borkenberge (BULLSEYE 279/125), niveau moyen. Ajoute une défense courte portée (SA-15, SA-8 ou SA-19, tirée au sort à chaque activation), en plus du niveau facile. Ravitailleur le plus proche : Arco 2 (TACAN 54Y, 254.0) à 79 nm. Un seul niveau de cette famille à la fois.'
